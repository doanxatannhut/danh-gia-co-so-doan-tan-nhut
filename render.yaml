services:
  - type: web
    name: danh-gia-co-so-doan-tan-nhut
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4100
      - key: SESSION_SECRET
        generateValue: true
